name: Deploy Online Resume

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: online-resume-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check project
        run: npm run check

      - name: Build Astro
        run: npm run build

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Clone public Pages repo
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${PAGES_DEPLOY_TOKEN}@github.com/David-Hackro/David-Hackro.github.io.git" \
            pages-repo

      - name: Copy generated site
        run: |
          rsync -av --delete \
            --exclude='.git' \
            dist/ pages-repo/

      - name: Publish generated site
        working-directory: pages-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "deploy: update online resume"
          git branch -M main
          git push origin main
